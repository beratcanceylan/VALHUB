sonar.projectKey=beratcanceylan_VALHUB
sonar.organization=brtcae

sonar.sources=.
sonar.exclusions=test/**,packages/*/test/**,coverage/**,node_modules/**,dist/**,assets/**
sonar.tests=test,packages/core/test,packages/domain/test

sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/mobile/lcov.info

# Translation dictionaries share the same keys by design.
sonar.cpd.exclusions=src/i18n/*.ts

# React Native screens and components are verified on device (plus targeted a11y tests);
# core adapters, domain, data layer and services are unit tested.
sonar.coverage.exclusions=**/*.tsx
